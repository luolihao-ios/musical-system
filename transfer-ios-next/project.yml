name: AiYueTransferNext
options:
  bundleIdPrefix: com.luolihao
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AiyueTransfer:
    type: application
    platform: iOS
    sources:
      - path: MuseTransfer
      - path: ../transfer-ios/MuseTransfer/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luolihao.aiyuetransfer
        PRODUCT_NAME: AiYueTransfer
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MuseTransfer/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - AiyueTransferTests
  AiyueTransferTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MuseTransferTests
    dependencies:
      - target: AiyueTransfer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luolihao.aiyuetransfer.next.tests
        GENERATE_INFOPLIST_FILE: YES
