name: AiYueTransferNext
options:
  bundleIdPrefix: com.luolihao
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  AiyueTransfer:
    type: application
    platform: iOS
    sources:
      - path: MuseTransfer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luolihao.aiyuetransfer.next
        PRODUCT_NAME: AiYueTransfer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 爱乐互传
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 爱乐互传需要访问局域网，以发现并连接您确认的附近设备。
        INFOPLIST_KEY_NSBonjourServices: "_aiyue._tcp"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  AiyueTransferTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MuseTransferTests
    dependencies:
      - target: AiyueTransfer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luolihao.aiyuetransfer.next.tests
        GENERATE_INFOPLIST_FILE: YES
