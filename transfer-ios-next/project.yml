name: AiYueTransferNext
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
options:
  bundleIdPrefix: com.luolihao
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "102"
targets:
  AiyueTransfer:
    type: application
    dependencies:
      - package: ZIPFoundation
    platform: iOS
    sources:
      - path: ../shared-swift/MusicPackage.swift
      - path: MuseTransfer
        excludes:
          - WebAssets
      - path: MuseTransfer/WebAssets
        type: folder
        buildPhase: resources
      - path: ../transfer-ios/MuseTransfer/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luolihao.aiyuetransfer
        PRODUCT_NAME: AiYueTransfer
        SWIFT_MODULE_NAME: AiyueTransfer
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MuseTransfer/Info.plist
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_ENTITLEMENTS: MuseTransfer/MuseTransfer.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - AiyueTransferTests
  AiyueTransferTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MuseTransferTests
    dependencies:
      - target: AiyueTransfer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luolihao.aiyuetransfer.next.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AiYueTransfer.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AiYueTransfer"
        BUNDLE_LOADER: "$(TEST_HOST)"
