name: Muse Transfer Windows

on:
  push:
    branches:
      - "codex/muse-transfer"
    paths:
      - "transfer-windows/**"
      - "docs/transfer-protocol/**"
      - ".github/workflows/muse-transfer-windows.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "transfer-windows/**"
      - "docs/transfer-protocol/**"
      - ".github/workflows/muse-transfer-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Verify and publish
        shell: pwsh
        run: ./transfer-windows/scripts/verify.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup.7 --exact --source winget --silent --accept-package-agreements --accept-source-agreements
      - name: Build installer
        shell: pwsh
        run: ./transfer-windows/scripts/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: MuseTransfer-Windows-x64
          path: transfer-windows/artifacts/installer/MuseTransfer-Setup.exe
          if-no-files-found: error
