name: iOS native unsigned IPA

on:
  push:
    paths:
      - "ios-app/**"
      - "shared-swift/**"
      - ".github/workflows/ios-native.yml"
  pull_request:
    paths:
      - "ios-app/**"
      - "shared-swift/**"
      - ".github/workflows/ios-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adaptive-layout:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - name: Prepare actual iOS 27.1 device runtime
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -downloadPlatform iOS -buildVersion 27.1 -architectureVariant arm64
          mkdir -p ios-app/build/adaptive
          xcrun simctl help > ios-app/build/adaptive/simctl-help.txt
          xcrun simctl help ui > ios-app/build/adaptive/simctl-ui-help.txt
          xcrun simctl help io > ios-app/build/adaptive/simctl-io-help.txt
          xcrun simctl list devicetypes -j > ios-app/build/adaptive/device-types.json
          xcrun simctl list runtimes -j > ios-app/build/adaptive/runtimes.json
      - name: Test iPhone, iPad and iPhone Duo production player
        run: |
          set -euo pipefail
          xcodegen generate --spec ios-app/project.yml
          for KIND in iphone ipad duo; do
            case "$KIND" in
              iphone) DEVICE_TYPE=com.apple.CoreSimulator.SimDeviceType.iPhone-17 ;;
              ipad) DEVICE_TYPE=com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M5-12GB ;;
              duo) DEVICE_TYPE=com.apple.CoreSimulator.SimDeviceType.iPhone-Duo ;;
            esac
            RUNTIME=$(python3 ios-app/scripts/adaptive_runtime.py --runtimes ios-app/build/adaptive/runtimes.json --type "$DEVICE_TYPE")
            DEVICE_ID=$(xcrun simctl create "AiYue $KIND" "$DEVICE_TYPE" "$RUNTIME")
            xcrun simctl boot "$DEVICE_ID"
            xcrun simctl bootstatus "$DEVICE_ID" -b
            xcrun simctl status_bar "$DEVICE_ID" override --time '9:41' --batteryState charged --batteryLevel 100
            xcodebuild test -project ios-app/LocalMusicPlayer.xcodeproj -scheme LocalMusicPlayer \
              -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath ios-app/build/AdaptiveDerivedData \
              -resultBundlePath "ios-app/build/adaptive/$KIND.xcresult" -parallel-testing-enabled NO \
              -only-testing:LocalMusicPlayerTests/AdaptivePlayerLayoutTests \
              -only-testing:LocalMusicPlayerTests/PlayerPanelInteractionTests \
              -only-testing:LocalMusicPlayerUITests/AdaptivePlayerUITests \
              -only-testing:LocalMusicPlayerUITests/StoreAssetCaptureTests \
              CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
            xcrun xcresulttool export attachments --path "ios-app/build/adaptive/$KIND.xcresult" --output-path "ios-app/build/adaptive/$KIND-images"
            xcrun simctl shutdown "$DEVICE_ID"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: adaptive-device-verification
          path: ios-app/build/adaptive
  test-and-package:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run iOS simulator tests
        run: ./ios-app/scripts/verify.sh
      - name: Build unsigned device IPA
        run: ./ios-app/scripts/package-unsigned-ipa.sh
      - name: Preserve simulator test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: player-interaction-test-evidence
          path: |
            ios-app/build/PlayerTests.xcresult
            ios-app/build/music-player-interaction.log
            ios-app/build/player-evidence
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: LocalMusicPlayer-iOS-unsigned
          path: ios-app/build/ipa/LocalMusicPlayer-unsigned.ipa
          if-no-files-found: error
