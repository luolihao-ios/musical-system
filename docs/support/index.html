      <h1>技术支持</h1>
      <p class="lead">帮助你整理并播放设备中已有的本地音乐。</p>
      <section class="card">
        <h2>如何导入音乐？</h2>
        <p>在音乐库中点击导入，按照系统提示允许访问本地音乐。App 只读取你设备上已有且可播放的音乐，不会下载歌曲。</p>
      </section>
      <section class="card">
        <h2>如何显示歌词？</h2>
        <p>导入与歌曲对应的本地歌词后，可在播放页切换到歌词视图。点击某一句歌词可以跳转到对应播放位置。</p>
      </section>
