    <div class="brand">愛樂互傳</div><h1>隱私權政策</h1><p class="lead">生效日期：2026 年 9 月 8 日</p>
    <section class="card"><h2>我們不收集你的資料</h2><p>愛樂互傳不要求建立帳號，不使用分析、廣告或追蹤服務。我們不會將你的個人資訊、檔案內容或使用記錄上傳到開發者伺服器。</p></section>
    <section class="card"><h2>本地網路和檔案</h2><p>App 使用本地網路權限，讓你在同一 Wi-Fi 下透過電腦瀏覽器傳輸檔案。只有你主動選擇的檔案才會傳輸；檔案只保存在你的裝置和你授權的本地裝置上。</p></section>
    <section class="card"><h2>診斷日誌</h2><p>診斷日誌僅保存在你的裝置上，不會自動傳送給我們。只有當你主動提交日誌以要求支援時，我們才會收到該內容。</p></section>
