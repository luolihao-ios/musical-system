name: MuseTransfer

options:
  bundleIdPrefix: com.luolihao
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""

targets:
  MuseTransferCore:
    type: framework
    platform: iOS
    sources:
      - path: MuseTransfer/Protocol
      - path: MuseTransfer/Transfer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luolihao.musetransfer.core
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets:
        - MuseTransferTests

  MuseTransferTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MuseTransferTests
    resources:
      - path: ../docs/transfer-protocol/vectors
    dependencies:
      - target: MuseTransferCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luolihao.musetransfer.tests
        GENERATE_INFOPLIST_FILE: YES
