name: LocalMusicPlayer

options:
  bundleIdPrefix: com.luolihao
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  LocalMusicPlayer:
    type: application
    platform: iOS
    sources:
      - path: LocalMusicPlayer
        excludes:
          - Resources
          - Info.plist
    resources:
      - path: LocalMusicPlayer/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luolihao.musicalsystem
        PRODUCT_NAME: LocalMusicPlayer
        INFOPLIST_FILE: LocalMusicPlayer/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - LocalMusicPlayerTests

  LocalMusicPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LocalMusicPlayerTests
    dependencies:
      - target: LocalMusicPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luolihao.musicalsystem.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LocalMusicPlayer.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/LocalMusicPlayer"
        BUNDLE_LOADER: "$(TEST_HOST)"
